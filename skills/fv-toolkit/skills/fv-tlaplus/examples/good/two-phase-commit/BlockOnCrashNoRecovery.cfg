\* expect: deadlock
\* The coordinator crashes before it decides and never recovers. A manager
\* that already prepared has no move: this is the blocking that gives
\* two-phase commit its name.
SPECIFICATION Spec
CONSTANTS
    RM = {r1, r2}
    Order = "block_on_crash"
    MaxCrashes = 1
    Recovers = FALSE
INVARIANT AllOrNothing
