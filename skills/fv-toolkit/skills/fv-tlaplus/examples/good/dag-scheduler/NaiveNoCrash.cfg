\* expect: holds
\* The same rejected design with the fault switched off. It holds, so the
\* crash is what breaks it: with no crash, A reaches done before B's
\* weak check ever gets a chance to matter.
SPECIFICATION FairSpec
CONSTANTS
    Order = "naive"
    MaxCrashes = 0
INVARIANT NeverRunsTwice
PROPERTY EventuallyBothDone
