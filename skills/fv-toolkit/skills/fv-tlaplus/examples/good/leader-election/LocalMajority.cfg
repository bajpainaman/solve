\* expect: violated AtMostOneLeaderPerTerm
\* A candidate needs only a majority of what it can reach, so both sides of
\* the split elect their own leader for the same term.
SPECIFICATION Spec
CONSTANTS
    Node = {n1, n2, n3, n4, n5}
    Order = "local_majority"
    Partitioned = TRUE
    IsolatedNodes = {n4, n5}
INVARIANT AtMostOneLeaderPerTerm
