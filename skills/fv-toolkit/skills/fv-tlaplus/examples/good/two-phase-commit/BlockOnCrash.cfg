\* expect: holds
\* A prepared manager waits for the coordinator. The coordinator recovers,
\* so the protocol still decides.
SPECIFICATION FairSpec
CONSTANTS
    RM = {r1, r2}
    Order = "block_on_crash"
    MaxCrashes = 1
    Recovers = TRUE
INVARIANTS TypeOK AllOrNothing
PROPERTY EventuallyDecided
