title: solve
description: One skill for decisions, clear writing, and reviewable HTML pages.
theme: jekyll-theme-cayman
url: https://bajpainaman.github.io
baseurl: /solve
markdown: kramdown
plugins:
  - jemoji
  - jekyll-mentions
  - jekyll-relative-links

include:
  - frameworks
  - bin
  - templates

exclude:
  - node_modules
  - install
  - solve
  - html
  - write/vale
  - "*.bak"
  - .DS_Store

defaults:
  - scope:
      path: ""
    values:
      layout: default

# So mermaid renders on Pages
mermaid: true

# Pages enabled 2026-05-04
