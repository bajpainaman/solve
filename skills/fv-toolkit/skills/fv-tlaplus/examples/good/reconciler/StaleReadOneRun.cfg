\* expect: holds
\* The same rejected design with the fault switched off: the loop may
\* only run once before a create has to land. It holds, so running again
\* on a cache that has not synced yet is what causes the overshoot.
SPECIFICATION FairSpec
CONSTANTS
    Order = "stale_read"
    MaxReconciles = 1
INVARIANT NeverOvershoots
PROPERTY EventuallyConverges
