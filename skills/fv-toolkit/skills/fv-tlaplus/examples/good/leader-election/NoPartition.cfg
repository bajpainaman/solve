\* expect: holds
\* The same design with the fault switched off. It holds, so the partition
\* is what lets both sides win: with no split, a majority of what a
\* candidate can reach is a majority of the whole cluster too.
SPECIFICATION Spec
CONSTANTS
    Node = {n1, n2, n3, n4, n5}
    Order = "local_majority"
    Partitioned = FALSE
    IsolatedNodes = {n4, n5}
INVARIANT AtMostOneLeaderPerTerm
