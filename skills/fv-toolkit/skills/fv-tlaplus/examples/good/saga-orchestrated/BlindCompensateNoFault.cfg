\* expect: holds
\* The same design with the fault switched off. SettledEffectIsFinal holds,
\* so the fault is what makes a settled saga race a late attempt: with the
\* fault off, the timeout waits for every attempt to resolve first.
SPECIFICATION FairSpec
CONSTANTS
    Order = "blind_compensate"
    AllowLateApply = FALSE
INVARIANT SettledEffectIsFinal
PROPERTY EventuallyDone
