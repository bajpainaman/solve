\* expect: holds
\* A candidate needs a majority of the whole cluster, so only the larger
\* side of the split can ever elect a leader.
SPECIFICATION Spec
CONSTANTS
    Node = {n1, n2, n3, n4, n5}
    Order = "cluster_majority"
    Partitioned = TRUE
    IsolatedNodes = {n4, n5}
INVARIANTS TypeOK AtMostOneLeaderPerTerm
